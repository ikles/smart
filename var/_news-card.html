<a href="" class="news-card">
  <div class="news-card__img-w">
    <img class="news-card__img" src="@@img" alt="">
  </div>
  <div class="news-card__body">
    <span class="news-card__date">@@date</span>
    <h3 class="news-card__title">@@title</h3>
    <p class="news-card__text">@@txt</p>
    <div class="news-card__link">
      Смотреть фото
      <span class="news-card__link-icon" aria-hidden="true">
        <svg viewBox="0 0 20 12" fill="none"><path d="M1 6h17M13 1l5 5-5 5" stroke="#52bbb5" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </div>
  </div>
</a>
