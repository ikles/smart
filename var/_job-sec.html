<div class="job-sec">
  <div class="job-sec__title">@@title</div>
  <div class="job-sec__price">@@price</div>
  <div class="job-sec__text">@@txt</div>
  <div class="job-sec__tags">
    <div class="job-sec__tag">
      <div class="job-sec__tag-ico _bag"></div>
      <div class="job-sec__tag-txt">Опыт от 3 лет</div>
    </div>
    <div class="job-sec__tag">
      <div class="job-sec__tag-ico _time"></div>
      <div class="job-sec__tag-txt">г. Тверь</div>
    </div>
    <div class="job-sec__tag">
      <div class="job-sec__tag-ico _geo"></div>
      <div class="job-sec__tag-txt">Полный день</div>
    </div>
    <div class="job-sec__tag">
      <div class="job-sec__tag-ico _obr"></div>
      <div class="job-sec__tag-txt">Высшее / ср. спец.</div>
    </div>
    <div class="job-sec__tag">
      <div class="job-sec__tag-ico _naks"></div>
      <div class="job-sec__tag-txt">НАКС</div>
    </div>
  </div>
  <a href="" class="job-sec__btn btn btn--arrow-after">
    Откликнуться
  </a>
  @@fast
</div>
